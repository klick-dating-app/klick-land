<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#101a2e" />
    <title>Klick Land</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: calc(env(safe-area-inset-top) + 24px) 24px
          calc(env(safe-area-inset-bottom) + 24px);
        background: radial-gradient(circle at 50% 30%, #16233d 0%, #0b1220 70%);
        color: #f4f6fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }
      h1 {
        font-size: 20px;
        margin: 8px 0 0;
        font-weight: 700;
      }
      p {
        margin: 0;
        max-width: 320px;
        font-size: 14px;
        line-height: 1.5;
        color: #aab4c8;
      }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #c81f45, #ff5a3c);
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <img src="logo.png" alt="Klick Land" />
    <h1>Klick Land</h1>
    <p id="msg">
      You need an internet connection to use the app. Check your network and try
      again.
    </p>
    <button id="retry" type="button">Retry</button>
    <script>
      // Este archivo solo se muestra cuando el contenido remoto no carga
      // (sin conexión). Al reintentar, volvemos a la URL de producción.
      var SERVER_URL = "https://click-with-purpose.onrender.com";
      document.getElementById("retry").addEventListener("click", function () {
        window.location.href = SERVER_URL;
      });
      window.addEventListener("online", function () {
        window.location.href = SERVER_URL;
      });
    </script>
  </body>
</html>
